lab_id: TP4
title: "TP n°4 — Programmation Assembleur (MicroSim x86)"
total_points: 20.0
score_rounding: 0.25

exercises:
  - id: feux1
    file: feux1.asm
    title: "Feux de circulation v1"
    weight: 1.5
    static_checks:
      - name: "Utilisation du port feux (OUT 0x02)"
        pattern: "out_port:2"
        points: 0.5
      - name: "Boucle infinie (JMP)"
        pattern: "mnemonic:JMP"
        points: 0.5
      - name: "Chargement de configurations (MOV AL, ...)"
        pattern: "mnemonic:MOV"
        points: 0.5

  - id: feux2
    file: feux2.asm
    title: "Feux de circulation v2 (table de données)"
    weight: 2.0
    static_checks:
      - name: "Table de données (ORG + DB)"
        pattern: "all:mnemonic:ORG,mnemonic:DB"
        points: 0.5
      - name: "Adressage indirect ([BL]/[CL]/[DL])"
        pattern: "indirect_reg"
        points: 0.5
      - name: "Test sentinelle (CMP ... 0xFF)"
        pattern: "mnemonic:CMP"
        points: 0.5
      - name: "Port feux (OUT 0x02)"
        pattern: "out_port:2"
        points: 0.5

  - id: saisie
    file: saisie.asm
    title: "Saisie et affichage inversé via pile"
    weight: 2.5
    static_checks:
      - name: "Lecture clavier (IN 0x01)"
        pattern: "in_port:1"
        points: 0.5
      - name: "Utilisation de la pile (PUSH et POP)"
        pattern: "all:mnemonic:PUSH,mnemonic:POP"
        points: 0.5
      - name: "Test touche Entrée (CMP ..., 0x0D)"
        pattern: "mnemonic:CMP"
        points: 0.5
      - name: "Écriture en mémoire écran (adressage indirect)"
        pattern: "indirect_reg"
        points: 0.5

  - id: temp
    file: temp.asm
    title: "Régulation de la température"
    weight: 2.0
    static_checks:
      - name: "Lecture/écriture chaudière (port 0x03)"
        pattern: "all:in_port:3,out_port:3"
        points: 0.5
      - name: "Masque ou manipulation binaire (AND/XOR/NOT/SHL)"
        pattern: "any:mnemonic:AND,mnemonic:XOR,mnemonic:NOT,mnemonic:SHL"
        points: 0.5
      - name: "Saut conditionnel ou boucle"
        pattern: "any:mnemonic:JZ,mnemonic:JNZ,mnemonic:JMP"
        points: 0.5

  - id: fibo
    file: fibo.asm
    title: "Suite de Fibonacci"
    weight: 2.0
    static_checks:
      - name: "Addition (ADD)"
        pattern: "mnemonic:ADD"
        points: 0.5
      - name: "Sauvegarde temporaire sur pile (PUSH/POP)"
        pattern: "all:mnemonic:PUSH,mnemonic:POP"
        points: 0.5
      - name: "Test de dépassement (JNC/JC/JNS/JS)"
        pattern: "any:mnemonic:JNC,mnemonic:JC,mnemonic:JNS,mnemonic:JS"
        points: 0.5

  - id: feux3
    file: feux3.asm
    title: "Temporisation paramétrable"
    weight: 2.0
    static_checks:
      - name: "Appel de routine (CALL et RET)"
        pattern: "all:mnemonic:CALL,mnemonic:RET"
        points: 0.5
      - name: "Sauvegarde de contexte (PUSH/POP ou PUSHF/POPF)"
        pattern: "any:mnemonic:PUSH,mnemonic:PUSHF"
        points: 0.5
      - name: "Boucle de décrémentation (DEC + JNZ)"
        pattern: "all:mnemonic:DEC,mnemonic:JNZ"
        points: 0.5
      - name: "Table de données (ORG + DB)"
        pattern: "all:mnemonic:ORG,mnemonic:DB"
        points: 0.5

  - id: read
    file: read.asm
    title: "Routine de saisie d'une chaîne"
    weight: 2.0
    static_checks:
      - name: "Routine et appel (CALL / RET)"
        pattern: "all:mnemonic:CALL,mnemonic:RET"
        points: 0.5
      - name: "Lecture clavier (IN 0x01)"
        pattern: "in_port:1"
        points: 0.5
      - name: "Mémorisation indirecte ([BL])"
        pattern: "indirect_reg"
        points: 0.5

  - id: print
    file: print.asm
    title: "Routine d'affichage d'une chaîne"
    weight: 2.0
    static_checks:
      - name: "Routine et appel (CALL / RET)"
        pattern: "all:mnemonic:CALL,mnemonic:RET"
        points: 0.5
      - name: "Calcul de position écran (MUL / ADD 0xC0)"
        pattern: "all:mnemonic:MUL,mnemonic:ADD"
        points: 0.5
      - name: "Lecture/écriture indirecte ([BL] / [CL])"
        pattern: "indirect_reg"
        points: 0.5

  - id: upcase
    file: upcase.asm
    title: "Routine de mise en majuscules"
    weight: 2.0
    static_checks:
      - name: "Routine et appel (CALL / RET)"
        pattern: "all:mnemonic:CALL,mnemonic:RET"
        points: 0.5
      - name: "Conversion ASCII (SUB 0x20)"
        pattern: "mnemonic:SUB"
        points: 0.5
      - name: "Test fin de chaîne (CMP ..., 0x00)"
        pattern: "mnemonic:CMP"
        points: 0.5

  - id: compare
    file: compare.asm
    title: "Fonction de comparaison de chaînes"
    weight: 2.0
    static_checks:
      - name: "Routine et appel (CALL / RET)"
        pattern: "all:mnemonic:CALL,mnemonic:RET"
        points: 0.5
      - name: "Comparaison caractère par caractère (CMP)"
        pattern: "mnemonic:CMP"
        points: 0.5
      - name: "Commande des feux selon Z (OUT 0x02)"
        pattern: "out_port:2"
        points: 0.5
